name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK with Buildozer
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake autopoint \
            libtool libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade buildozer 'cython<3.4'

      - name: Build debug APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
        run: |
          buildozer -v android debug

      - name: Find APK
        id: apk
        run: |
          APK=$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK was produced. Contents of bin/:"
            find bin -maxdepth 2 -type f -print || true
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: belkuri-crunch-debug-apk
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
