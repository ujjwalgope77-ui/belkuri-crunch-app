name: Build BELKURI CRUNCH APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf automake libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/kivy/buildozer.git
          python -m pip install \
            legacy-cgi \
            setuptools \
            cython==0.29.34

      - name: Configure Buildozer
        run: |
          # Remove existing duplicate configuration lines
          sed -i '/^[[:space:]]*p4a.branch[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android.api[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android.ndk[[:space:]]*=/d' buildozer.spec

          # Add exactly one configuration for each option
          printf '\np4a.branch = develop\n' >> buildozer.spec
          printf 'android.api = 36\n' >> buildozer.spec
          printf 'android.ndk = 29\n' >> buildozer.spec

          echo "===== Android configuration ====="
          grep -E '^[[:space:]]*(p4a.branch|android.api|android.ndk)[[:space:]]*=' buildozer.spec

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: List generated APK
        run: |
          find bin -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BELKURI-CRUNCH-APK
          path: bin/*.apk
          if-no-files-found: error
