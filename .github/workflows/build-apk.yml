name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      
      - name: Build APK
  working-directory: belkuri-crunch
  run: |
        
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "===== BUILD ERRORS ====="
          grep -nEi "error:|fatal error|configure: error|undefined reference" build.log || true
          exit $status

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: belkuri-crunch-apk
          path: belkuri-crunch/bin/*.apk
